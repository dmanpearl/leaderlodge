{% if user.is_authenticated %}
  <a href="{% url 'feedback:create' %}" class="{{ classes }}">
    {% if icon %}
      <i class="bi bi-chat-left-text {{ icon_class|default:'navbar-menu-icon' }}" aria-hidden="true"></i>
    {% endif %}
    {{ label }}
  </a>
{% else %}
  <button
    type="button"
    class="{{ classes }}"
    data-guest-auth-trigger
    data-guest-auth-message="{{ guest_feedback_auth_message }}"
  >
    {% if icon %}
      <i class="bi bi-chat-left-text {{ icon_class|default:'navbar-menu-icon' }}" aria-hidden="true"></i>
    {% endif %}
    {{ label }}
  </button>
{% endif %}
