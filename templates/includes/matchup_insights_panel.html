{% load static %}
<div
  class="offcanvas offcanvas-end player-insights-offcanvas"
  tabindex="-1"
  id="{{ panel_id }}"
  aria-labelledby="{{ panel_id }}-title"
  data-insights-url="{% url 'insights:matchup' %}"
  data-insights-scope="matchup"
  data-game-id="{{ game.pk }}"
>
  <div class="offcanvas-header">
    <div>
      <h2 class="offcanvas-title h5 mb-0" id="{{ panel_id }}-title">
        Insights
      </h2>
      <p class="text-muted small mb-0">
        Matchup &middot; {{ game.group.name }} &middot; {{ game_type.name }} &middot; {{ game.played_on|date:"M j, Y" }}
      </p>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column gap-3">
    <div>
      <label for="{{ panel_id }}-model" class="form-label">Model</label>
      <select id="{{ panel_id }}-model" class="form-select insights-model-select">
        {% for model in insight_models %}
          <option value="{{ model.slug }}" {% if model.slug == selected_insight_model %}selected{% endif %}>
            {{ model.label }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div>
      <span class="form-label d-block">Preset</span>
      <div class="btn-group flex-wrap player-insights-presets" role="group" aria-label="Insight presets">
        <input type="radio" class="btn-check insights-preset-input" name="{{ panel_id }}-preset" id="{{ panel_id }}-preset-dynamics" value="dynamics" autocomplete="off" checked />
        <label class="btn btn-insights-outline btn-sm" for="{{ panel_id }}-preset-dynamics">Dynamics</label>
        <input type="radio" class="btn-check insights-preset-input" name="{{ panel_id }}-preset" id="{{ panel_id }}-preset-head-to-head" value="head_to_head" autocomplete="off" />
        <label class="btn btn-insights-outline btn-sm" for="{{ panel_id }}-preset-head-to-head">Head to head</label>
        <input type="radio" class="btn-check insights-preset-input" name="{{ panel_id }}-preset" id="{{ panel_id }}-preset-game-impact" value="game_impact" autocomplete="off" />
        <label class="btn btn-insights-outline btn-sm" for="{{ panel_id }}-preset-game-impact">This game</label>
        <input type="radio" class="btn-check insights-preset-input" name="{{ panel_id }}-preset" id="{{ panel_id }}-preset-custom" value="custom" autocomplete="off" />
        <label class="btn btn-insights-outline btn-sm" for="{{ panel_id }}-preset-custom">Ask</label>
      </div>
    </div>

    <div id="{{ panel_id }}-custom-wrap" class="insights-custom-wrap d-none">
      <label for="{{ panel_id }}-question" class="form-label">Your question</label>
      <input
        type="text"
        id="{{ panel_id }}-question"
        class="form-control insights-question-input"
        maxlength="500"
        placeholder="What stands out in this matchup?"
      />
    </div>

    <div class="d-flex flex-wrap gap-2">
      <button type="button" id="{{ panel_id }}-generate" class="btn btn-insights insights-generate-btn">
        <i class="bi bi-stars" aria-hidden="true"></i> Generate
      </button>
      <button type="button" class="btn btn-outline-secondary insights-copy-btn" disabled>Copy</button>
      <button type="button" class="btn btn-outline-secondary insights-regenerate-btn" disabled>Regenerate</button>
    </div>

    <p class="text-muted small mb-0">
      AI summary. Rankings are computed by LeaderLodge.
    </p>

    <div class="insights-status small text-muted" aria-live="polite"></div>
    <div class="insights-error alert alert-danger d-none mb-0" role="alert"></div>
    <div class="insights-result player-insights-result flex-grow-1"></div>
  </div>
</div>
