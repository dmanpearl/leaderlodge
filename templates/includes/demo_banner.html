{% if is_visitor and demo_mode_enabled %}
  <div class="demo-banner alert alert-info mb-0 border-0 rounded-0 py-1 small">
    <div class="demo-banner-inner">
      <p class="demo-banner-message mb-0">
        Login to view your own Games, Groups, and Leaders, or to leave feedback
      </p>
      <p class="demo-banner-actions mb-0">
        <a
          href="{% url 'accounts:login' %}?next={{ request.path|urlencode }}"
          class="demo-banner-action-link"
        >Login</a><span class="demo-banner-action-sep" aria-hidden="true">·</span><a
          href="{% url 'accounts:signup' %}"
          class="demo-banner-action-link"
        >Sign up</a>
      </p>
    </div>
  </div>
{% endif %}
