{% extends "base.html" %}

{% block title %}Login | LeaderLodge{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 mb-3">Sign in</h1>
          <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="mb-3">
              <label for="id_username" class="form-label">Username</label>
              <input
                type="text"
                name="username"
                autofocus
                required
                class="form-control"
                id="id_username"
              />
            </div>
            <div class="mb-3">
              <label for="id_password" class="form-label">Password</label>
              <div class="input-group">
                <input
                  type="password"
                  name="password"
                  required
                  class="form-control"
                  id="id_password"
                />
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  id="login-password-toggle"
                  aria-label="Show password"
                  aria-pressed="false"
                  aria-controls="id_password"
                >
                  <i class="bi bi-eye" id="login-password-toggle-icon" aria-hidden="true"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% block extra_js %}
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const input = document.getElementById("id_password");
      const toggle = document.getElementById("login-password-toggle");
      const icon = document.getElementById("login-password-toggle-icon");
      if (!input || !toggle || !icon) {
        return;
      }

      toggle.addEventListener("click", () => {
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        icon.classList.toggle("bi-eye", showing);
        icon.classList.toggle("bi-eye-slash", !showing);
        toggle.setAttribute("aria-label", showing ? "Show password" : "Hide password");
        toggle.setAttribute("aria-pressed", String(!showing));
      });
    });
  </script>
{% endblock %}
