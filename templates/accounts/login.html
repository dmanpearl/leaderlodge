{% extends "base.html" %}

{% block title %}Login | LeaderLodge{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 mb-3">Sign in</h1>
          <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="mb-3">
              <label for="id_username" class="form-label">Username</label>
              <input
                type="text"
                name="username"
                autofocus
                required
                class="form-control"
                id="id_username"
              />
            </div>
            <div class="mb-3">
              <label for="id_password" class="form-label">Password</label>
              <input
                type="password"
                name="password"
                required
                class="form-control"
                id="id_password"
              />
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
