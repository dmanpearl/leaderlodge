{% extends "base.html" %}

{% block title %}Reset email sent | LeaderLodge{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 mb-3">Check your email</h1>
          <p class="text-muted mb-0">
            If an account exists for that address, we sent a password reset link. It may take a few minutes to arrive.
          </p>
          <p class="text-muted small mb-0 mt-3">
            <a href="{% url 'accounts:login' %}">Back to sign in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
