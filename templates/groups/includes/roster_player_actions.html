{% if row.can_invite or row.show_remove %}
  <div class="dropdown">
    <button
      type="button"
      class="btn btn-sm btn-outline-secondary"
      data-bs-toggle="dropdown"
      aria-expanded="false"
      title="Actions"
      aria-label="Actions for {{ player.display_label }}"
    >
      <i class="bi bi-three-dots" aria-hidden="true"></i>
    </button>
    <ul class="dropdown-menu dropdown-menu-end">
      {% if row.can_invite %}
        <li>
          <button
            type="button"
            class="dropdown-item"
            data-roster-invite
            data-player-name="{{ player.display_label }}"
            data-invite-url="{% url 'groups:player_invite' group.pk player.pk %}"
          >
            Invite
          </button>
        </li>
      {% endif %}
      {% if row.remove_url_name %}
        <li>
          <form
            method="post"
            action="{% url row.remove_url_name group.pk row.remove_target_pk %}"
          >
            {% csrf_token %}
            <button type="submit" class="dropdown-item text-danger">
              Remove from Group
            </button>
          </form>
        </li>
      {% elif row.show_remove %}
        <li>
          <span
            class="dropdown-item disabled text-muted"
            title="{{ row.disabled_reason }}"
          >
            Remove from Group
          </span>
        </li>
      {% endif %}
    </ul>
  </div>
{% endif %}
