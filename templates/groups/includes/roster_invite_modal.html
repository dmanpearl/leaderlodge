{% if can_manage_members and not is_guest_demo %}
  <div
    class="modal fade"
    id="roster-invite-modal"
    tabindex="-1"
    aria-labelledby="roster-invite-modal-label"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form method="post" id="roster-invite-form">
          {% csrf_token %}
          <input type="hidden" name="next" id="roster-invite-next" value="" />
          <div class="modal-header">
            <h2 class="modal-title h5" id="roster-invite-modal-label">Invite player</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p class="mb-3">
              Send an email invitation for <strong id="roster-invite-player-name"></strong>.
            </p>
            <label for="roster-invite-email" class="form-label">Email</label>
            <input
              type="email"
              name="email"
              id="roster-invite-email"
              class="form-control"
              placeholder="Email address"
              autocomplete="email"
              required
            />
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Send invite</button>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endif %}
