<div
  class="modal fade location-set-place-modal"
  id="location-set-place-modal"
  tabindex="-1"
  aria-labelledby="location-set-place-modal-label"
  aria-hidden="true"
  data-api-key="{{ google_places_api_key }}"
>
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      {# Own form so Enter in search does not submit the page Edit game form. #}
      <form id="location-set-place-form" action="#" method="post">
        <div class="modal-header">
          <h2 class="modal-title h5" id="location-set-place-modal-label">
            Set place
          </h2>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-2" id="location-set-place-subtitle"></p>

          <div class="location-map-toolbar">
            <div class="location-map-search-wrap combobox-input-wrap">
              <label class="visually-hidden" for="location-map-search-input"
                >Search places</label
              >
              <input
                type="search"
                id="location-map-search-input"
                class="form-control location-map-search-input"
                placeholder="Search for a place"
                autocomplete="off"
              />
              <button
                type="submit"
                class="location-map-search-submit"
                id="location-map-search-btn"
                title="Search by place name"
                aria-label="Search by place name"
              >
                <i class="bi bi-arrow-return-left" aria-hidden="true"></i>
              </button>
            </div>
            <button
              type="button"
              class="btn btn-sm btn-link p-0 location-map-icon-btn"
              id="location-map-pin-lookup-btn"
              title="Find nearby places at the pin"
              aria-label="Find nearby places at the pin"
            >
              <i class="bi bi-pin-map" aria-hidden="true"></i>
            </button>
            <button
              type="button"
              class="btn btn-sm btn-link p-0 location-map-icon-btn"
              id="location-map-my-location-btn"
              title="Use my location"
              aria-label="Use my location"
            >
              <i class="bi bi-crosshair2" aria-hidden="true"></i>
            </button>
          </div>

          <div
            id="location-map-canvas"
            class="location-map-canvas"
            role="application"
            aria-label="Map"
          ></div>

          <div
            class="location-map-status text-danger"
            id="location-map-status"
            aria-live="polite"
          ></div>

          <ul
            id="location-map-results"
            class="location-map-results"
            role="listbox"
            aria-label="Place results"
            hidden
          ></ul>

          <div class="location-map-selected" id="location-map-selected">
            <span class="text-muted">Drop a pin or search, then pick a place.</span>
          </div>

          <div class="form-check mt-2">
            <input
              class="form-check-input"
              type="checkbox"
              id="location-map-adopt-name"
            />
            <label class="form-check-label" for="location-map-adopt-name">
              Use place name
            </label>
          </div>
        </div>
        <div class="modal-footer flex-wrap">
          <div class="location-map-footer-actions">
            <button
              type="button"
              class="btn btn-outline-secondary"
              id="location-map-clear-btn"
            >
              Clear
            </button>
            <button
              type="button"
              class="btn btn-primary"
              id="location-map-assign-btn"
              disabled
            >
              Assign
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
